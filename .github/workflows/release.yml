# Builds Linux (.deb), Windows (.exe installer) and macOS (universal .app in a .dmg).
# - On every push to sync or main: builds all three and keeps them as workflow artifacts
#   (a check that every platform still builds; nothing is published).
# - On a version tag (v1.2.3): also publishes them as a GitHub release, with the notes in
#   docs/releases/<tag>.md when it exists (else GitHub writes them from the commits).
#   The mac job is skipped on a pushed tag unless the repository variable RELEASE_MAC is "true"
#   (Settings > Variables); the release then has the .deb and .exe only. To add the Mac files
#   later: run this workflow by hand (Run workflow) on the tag, or use release-recovery.yml.
name: release

on:
  push:
    branches: [sync, main]
    tags: ["v*", "V*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # v1.2.3 on a tag, else 0.0.0-dev (a Debian version has to start with a digit)
  VERSION: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')) && github.ref_name || '0.0.0-dev' }}

jobs:
  probe:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        flags: ["-fno-vectorize", "-fno-slp-vectorize", "-fno-unroll-loops", "-fno-inline", "-fno-vectorize -fno-slp-vectorize", "-mllvm -aarch64-enable-ldst-opt=false", "-mllvm -enable-misched=false", "-mllvm -aarch64-enable-gep-opt=false -mllvm -aarch64-enable-cond-br-tune=false", "-fno-strict-aliasing -fno-math-errno", "-mllvm -aarch64-enable-machine-combiner=false -mllvm -enable-aarch64-ccmp=false"]
    steps:
      - uses: actions/checkout@v4
      - run: |
          clang++ -O2 -ffp-contract=off -fno-fast-math ${{ matrix.flags }} -std=c++17 -arch arm64 -mmacosx-version-min=11.0 -c -o /tmp/b.o src/bodyshell.cpp 2>&1 | grep -v warning | head -5
          echo "exit ${PIPESTATUS[0]}"
      - if: always()
        run: |
          ls ~/Library/Logs/DiagnosticReports/ || true
          clang++ -O2 -ffp-contract=off -fno-fast-math -std=c++17 -arch arm64 -mmacosx-version-min=11.0 -c -o /tmp/b.o src/bodyshell.cpp -Xclang -mllvm 2>&1 | head -0
          clang++ -O2 -ffp-contract=off -fno-fast-math -std=c++17 -arch arm64 -mmacosx-version-min=11.0 -c -o /tmp/b.o src/bodyshell.cpp 2>&1 | grep -E '^ *[0-9]+ |Stack dump|Program arguments|Running pass|While' | head -40
